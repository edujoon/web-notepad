<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="author" content="JOON <eduedujoon@gmail.com>">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="마크다운 서식을 정리하고 브라우저에 안전하게 저장하는 웹 메모장">
<title>메모장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --desk: #E4E7EC;
  --paper: #FFFFFF;
  --ink: #1B1E24;
  --muted: #5F6570;
  --faint: #8A909A;
  --rule: #D2D6DD;
  --hover: #EDEFF3;
  --press: #E2E5EB;
  --carbon: #3437A8;
  --carbon-ink: #FFFFFF;
  --carbon-soft: rgba(52, 55, 168, .13);
  --carbon-strong: rgba(52, 55, 168, .34);
  --danger: #B42318;
  --shadow: 0 10px 28px rgba(20, 24, 40, .16), 0 1px 3px rgba(20, 24, 40, .10);
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "Nanum Gothic Coding", "D2Coding", Consolas, "SF Mono", Menlo, monospace;
  --fs: 16px;
  --pad-x: 28px;
  --pad-y: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #121317; --paper: #1B1D22; --ink: #E3E5E9; --muted: #9EA3AD; --faint: #6E737C;
    --rule: #2C2F36; --hover: #24262C; --press: #2C2F36;
    --carbon: #9EA1FF; --carbon-ink: #121317;
    --carbon-soft: rgba(158, 161, 255, .16); --carbon-strong: rgba(158, 161, 255, .40);
    --danger: #F3A59C; --shadow: 0 10px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #121317; --paper: #1B1D22; --ink: #E3E5E9; --muted: #9EA3AD; --faint: #6E737C;
  --rule: #2C2F36; --hover: #24262C; --press: #2C2F36;
  --carbon: #9EA1FF; --carbon-ink: #121317;
  --carbon-soft: rgba(158, 161, 255, .16); --carbon-strong: rgba(158, 161, 255, .40);
  --danger: #F3A59C; --shadow: 0 10px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--desk); }
body { height: 100%; margin: 0; background: var(--desk); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--carbon); outline-offset: 1px; }
[hidden] { display: none !important; }
svg { display: block; }

#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

/* tabs */
.top { display: flex; align-items: flex-end; gap: 2px; padding: 7px 8px 0; background: var(--desk); min-width: 0; }
.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; height: 34px; border-radius: 7px 7px 0 0; color: var(--muted); flex: 0 0 auto; }
.tab:hover { background: rgba(127, 134, 150, .10); }
.tab.active { background: var(--paper); color: var(--ink); box-shadow: inset 0 2px 0 var(--carbon); }
.tab-main { display: flex; align-items: center; gap: 7px; height: 100%; padding: 0 4px 0 13px; max-width: 220px; border-radius: 7px 0 0 0; }
.tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.tab.active .tab-name { font-weight: 500; }
.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--carbon); flex: 0 0 auto; }
.tab-x { width: 26px; height: 26px; margin-right: 4px; border-radius: 5px; display: grid; place-items: center; color: var(--faint); opacity: 0; }
.tab:hover .tab-x, .tab.active .tab-x, .tab-x:focus-visible { opacity: 1; }
.tab-x:hover { background: var(--hover); color: var(--ink); }
.newtab { width: 30px; height: 30px; margin: 0 0 2px 4px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: 0 0 auto; }
.newtab:hover { background: rgba(127, 134, 150, .14); color: var(--ink); }

/* bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 8px; background: var(--paper); border-bottom: 1px solid var(--rule); flex-wrap: wrap; position: relative; z-index: 5; }
.menus { display: flex; gap: 1px; }
.menu { position: relative; }
.menu-btn { padding: 5px 10px; border-radius: 5px; font-size: 14px; }
.menu-btn:hover, .menu-btn[aria-expanded="true"] { background: var(--hover); }
.menu-pop { position: absolute; top: calc(100% + 4px); left: 0; min-width: 270px; padding: 5px; background: var(--paper); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); z-index: 20; }
.mi { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 6px 10px 6px 8px; border-radius: 5px; text-align: left; font-size: 14px; }
.mi:hover:not([aria-disabled="true"]), .mi:focus-visible { background: var(--hover); outline: none; }
.mi[aria-disabled="true"] { color: var(--faint); cursor: default; }
.mi .ck { visibility: hidden; color: var(--carbon); }
.mi[aria-checked="true"] .ck { visibility: visible; }
.mi kbd { font-family: var(--sans); font-size: 12.5px; color: var(--faint); }
.sep { height: 1px; background: var(--rule); margin: 5px 6px; }

.tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: flex; padding: 3px; background: var(--desk); border-radius: 8px; gap: 2px; }
.seg button { padding: 5px 12px; border-radius: 6px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--rule); }
.seg .s { display: none; }
.copy { display: flex; align-items: center; gap: 7px; padding: 7px 14px 7px 12px; border-radius: 7px; background: var(--carbon); color: var(--carbon-ink); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.copy:hover { filter: brightness(1.08); }
.copy:active { filter: brightness(.95); }

/* find */
.findbar { display: flex; align-items: flex-start; gap: 4px; padding: 7px 10px 7px 6px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.find-rows { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.find-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ftoggle { flex: 0 0 auto; width: 24px; height: 32px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
.ftoggle:hover { background: var(--hover); color: var(--ink); }
.ftoggle .chev { transition: transform .15s ease; }
.ftoggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.fq-wrap { position: relative; width: min(320px, 100%); }
.find-row input[type="text"] { width: min(320px, 100%); height: 32px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font-size: 14px; }
.find-row input[type="text"]:focus { border-color: var(--carbon); outline: none; box-shadow: 0 0 0 3px var(--carbon-soft); }
.find-row .fq-wrap input[type="text"] { width: 100%; padding-right: 86px; }
.fcount { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ibtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.tbtn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--rule); font-size: 13.5px; }
.tbtn:hover { background: var(--hover); }
.tbtn[aria-pressed="true"] { border-color: var(--carbon); color: var(--carbon); }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 4px 0 6px; user-select: none; }
.chk input { accent-color: var(--carbon); }
.find-close { margin-left: auto; }

.banner { padding: 8px 14px; font-size: 13px; background: var(--carbon-soft); color: var(--ink); border-bottom: 1px solid var(--rule); }

/* stage */
.stage { position: relative; flex: 1; min-height: 0; background: var(--paper); font-size: var(--fs); }
.editor-wrap { position: absolute; inset: 0; }
.backdrop, #ta {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0;
  padding: var(--pad-y) var(--pad-x);
  font-family: var(--sans); font-size: var(--fs); line-height: 1.75; letter-spacing: 0;
  tab-size: 4; -moz-tab-size: 4;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
  overflow: auto;
}
.stage.mono .backdrop, .stage.mono #ta { font-family: var(--mono); line-height: 1.65; }
.nowrap .backdrop, .nowrap #ta { white-space: pre; overflow-wrap: normal; }
.backdrop { color: transparent; pointer-events: none; z-index: 0; user-select: none; }
.backdrop mark { color: transparent; background: var(--carbon-soft); border-radius: 2px; }
.backdrop mark.cur { background: var(--carbon-strong); }
#ta { z-index: 1; background: transparent; color: var(--ink); caret-color: var(--carbon); resize: none; outline: none; }
#ta::placeholder { color: var(--faint); }
#ta::selection { background: var(--carbon-strong); }
#ta[readonly] { caret-color: transparent; }

.rendered { position: absolute; inset: 0; overflow: auto; padding: var(--pad-y) var(--pad-x) 64px; }
.md { max-width: 72ch; font-size: var(--fs); line-height: 1.8; overflow-wrap: break-word; word-break: keep-all; }
.md.fallback { white-space: pre-wrap; word-break: normal; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.35; margin: 1.5em 0 .5em; font-weight: 600; letter-spacing: -.01em; }
.md h1 { font-size: 1.65em; }
.md h2 { font-size: 1.32em; padding-bottom: .25em; border-bottom: 1px solid var(--rule); }
.md h3 { font-size: 1.14em; }
.md h4, .md h5, .md h6 { font-size: 1em; }
.md p { margin: .6em 0; }
.md ul, .md ol { padding-left: 1.5em; margin: .5em 0; }
.md li { margin: .2em 0; }
.md li > input[type="checkbox"] { margin: 0 .45em 0 -.1em; accent-color: var(--carbon); vertical-align: -.1em; }
.md ul:has(> li > input[type="checkbox"]) { list-style: none; padding-left: .4em; }
.md a { color: var(--carbon); text-underline-offset: 3px; }
.md strong { font-weight: 600; }
.md code { font-family: var(--mono); font-size: .9em; background: var(--hover); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--hover); padding: 12px 16px; border-radius: 7px; overflow-x: auto; line-height: 1.6; word-break: normal; }
.md pre code { background: none; padding: 0; font-size: .88em; }
.md blockquote { margin: .8em 0; padding: .1em 0 .1em 16px; border-left: 3px solid var(--carbon); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.6em 0; }
.md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: .8em 0; font-size: .95em; word-break: normal; }
.md th, .md td { border: 1px solid var(--rule); padding: 6px 12px; text-align: left; vertical-align: top; }
.md th { background: var(--hover); font-weight: 600; }
.md img { max-width: 100%; }
.md .empty { color: var(--faint); }

/* status */
.status { display: flex; align-items: center; height: 30px; padding: 0 4px; background: var(--desk); color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--rule); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.status > span { padding: 0 12px; }
.status > span + span { border-left: 1px solid var(--rule); }
.sync { margin-left: auto; display: flex; align-items: center; gap: 7px; border-left: 0 !important; }
.sheets { width: 16px; height: 16px; overflow: visible; }
.sheets .back { fill: var(--carbon); transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
.sheets .front { fill: var(--desk); stroke: var(--carbon); stroke-width: 1.4; }
.sync[data-state="wait"] .back, .sync[data-state="saving"] .back { opacity: .35; }
.sync[data-state="local"] .back { opacity: 0; }
.sync[data-state="error"] .back { fill: var(--danger); }
.sync[data-state="error"] .front { stroke: var(--danger); }
.sync[data-state="error"] .label { color: var(--danger); }
.sync.got .back { transform: translate(-2px, 2px); }

/* toast + dialog */
.toast-dock { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); display: flex; justify-content: center; pointer-events: none; z-index: 40; }
.toast { max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 13.5px; box-shadow: var(--shadow); opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: none; }
.dlg-layer { position: fixed; inset: 0; background: rgba(12, 14, 20, .38); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dlg { width: min(420px, 100%); background: var(--paper); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 20px 16px; }
.dlg h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
.dlg p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.dlg input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 7px; background: var(--paper); font-size: 15px; margin-bottom: 16px; }
.dlg input:focus { outline: none; border-color: var(--carbon); box-shadow: 0 0 0 3px var(--carbon-soft); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn { height: 36px; padding: 0 16px; border-radius: 7px; font-size: 14px; font-weight: 500; }
.btn.ghost:hover { background: var(--hover); }
.btn.primary { background: var(--carbon); color: var(--carbon-ink); }
.btn.danger { background: var(--danger); color: var(--paper); }

.about { width: min(360px, 100%); padding-top: 22px; }
.about-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.about-head h2 { margin: 0; }
.about-mark { width: 26px; height: 26px; overflow: visible; }
.about-mark .back { fill: var(--carbon); }
.about-mark .front { fill: var(--paper); stroke: var(--carbon); stroke-width: 1.3; }
.about-who { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 14.5px; user-select: text; }
.about-who .n { font-weight: 600; font-size: 15.5px; }
.about-who .m, .about-who .d { color: var(--muted); }
.about-lic { margin: 12px 0 18px !important; font-size: 13.5px !important; }
.about-lic span { color: var(--faint); margin-left: 4px; }

@media (max-width: 720px) {
  :root { --pad-x: 16px; --pad-y: 14px; }
  .tools { width: 100%; justify-content: space-between; }
  .bar { gap: 6px; }
  .st-zoom, .st-count { display: none; }
}
@media (max-width: 560px) {
  .seg .l { display: none; }
  .seg .s { display: inline; }
  .seg button { padding: 5px 11px; }
  .menu-btn { padding: 5px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .sheets .back, .ftoggle .chev { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="tabs" id="tabs" role="tablist" aria-label="메모 목록"></div>
    <button class="newtab" id="newTab" title="새 메모 (Alt+N)" aria-label="새 메모">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </header>

  <div class="bar">
    <nav class="menus" id="menus" aria-label="메뉴">
      <div class="menu">
        <button class="menu-btn" aria-haspopup="menu" aria-expanded="false">파일</button>
        <div class="menu-pop" role="menu" hidden>
          <button class="mi" role="menuitem" data-cmd="newNote"><span></span><span>새 메모</span><kbd data-alt="N"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="openFile"><span></span><span>파일 열기…</span><kbd></kbd></button>
          <div class="sep" role="separator"></div>
          <button class="mi" role="menuitem" data-cmd="saveTxt" data-need="downloads"><span></span><span>서식 제거 텍스트로 저장 (.txt)</span><kbd></kbd></button>
          <button class="mi" role="menuitem" data-cmd="saveMd" data-need="downloads"><span></span><span>마크다운 원본으로 저장 (.md)</span><kbd></kbd></button>

          <div class="sep" role="separator"></div>
          <button class="mi" role="menuitem" data-cmd="rename" data-need="write"><span></span><span>이름 바꾸기…</span><kbd></kbd></button>
          <button class="mi" role="menuitem" data-cmd="del" data-need="write"><span></span><span>메모 삭제…</span><kbd></kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" aria-haspopup="menu" aria-expanded="false">편집</button>
        <div class="menu-pop" role="menu" hidden>
          <button class="mi" role="menuitem" data-cmd="undo" data-need="write"><span></span><span>실행 취소</span><kbd data-mod="Z"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="redo" data-need="write"><span></span><span>다시 실행</span><kbd data-mod="Y"></kbd></button>
          <div class="sep" role="separator"></div>
          <button class="mi" role="menuitem" data-cmd="cut" data-need="edit"><span></span><span>잘라내기</span><kbd data-mod="X"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="copy"><span></span><span>복사</span><kbd data-mod="C"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="paste" data-need="edit"><span></span><span>붙여넣기</span><kbd data-mod="V"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="deleteSel" data-need="edit"><span></span><span>삭제</span><kbd>Del</kbd></button>
          <div class="sep" role="separator"></div>
          <button class="mi" role="menuitem" data-cmd="find"><span></span><span>찾기</span><kbd data-mod="F"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="findNext"><span></span><span>다음 찾기</span><kbd>F3</kbd></button>
          <button class="mi" role="menuitem" data-cmd="findPrev"><span></span><span>이전 찾기</span><kbd>Shift+F3</kbd></button>
          <button class="mi" role="menuitem" data-cmd="replace" data-need="write"><span></span><span>바꾸기</span><kbd data-mod="H"></kbd></button>
          <button class="mi" role="menuitem" data-cmd="goto"><span></span><span>줄 이동</span><kbd data-mod="G"></kbd></button>
          <div class="sep" role="separator"></div>
          <button class="mi" role="menuitem" data-cmd="selectAll"><span></span><span>모두 선택</span><kbd data-mod="A"></kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" aria-haspopup="menu" aria-expanded="false">서식</button>
        <div class="menu-pop" role="menu" hidden>
          <button class="mi" role="menuitemcheckbox" data-cmd="wrap" data-check="wrap"><span class="ck">✓</span><span>자동 줄 바꿈</span><kbd></kbd></button>
          <div class="sep" role="separator"></div>
          <button class="mi" role="menuitemradio" data-cmd="fontSans" data-check="fontSans"><span class="ck">✓</span><span>기본 글꼴</span><kbd></kbd></button>
          <button class="mi" role="menuitemradio" data-cmd="fontMono" data-check="fontMono"><span class="ck">✓</span><span>고정폭 글꼴</span><kbd></kbd></button>
        </div>

<script>

'use strict';

const HAS_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');

/* ============================================================
   Markdown stripper that keeps a map back to the source,
   so the "서식 제거 텍스트" view can be edited directly.
   ============================================================ */
function stripMd(raw) {
  const out = [], A = [], B = [], groups = [], lps = [];
  const n = raw.length;
  const emit = (ch, s, e) => { out.push(ch); A.push(s); B.push(e); };
  const emitRaw = (s, e) => { for (let i = s; i < e; i++) { out.push(raw[i]); A.push(i); B.push(i + 1); } };
  const PUNCT = /[!-\/:-@\[-`{-~]/;
  const WORD = /[\p{L}\p{N}]/u;
  const WS = /\s/;
  const TAG = /^<\/?(br|hr|b|strong|i|em|u|s|strike|del|ins|mark|sup|sub|span|small|big|kbd|code|a|font|center|p|div|img|abbr|cite|q|samp|var|tt)(?:\s[^<>]*)?\/?>/i;
  const DEF = /^ {0,3}\[((?:[^\]\\]|\\.)+)\]:[ \t]*(?:<[^>\n]*>|[^\s<>]\S*)(?:[ \t]+(?:"[^"]*"|'[^']*'|\([^)]*\)))?[ \t]*$/;
  const FENCE = /^ {0,3}(`{3,}|~{3,})(.*)$/;
  const norm = (l) => l.trim().replace(/\s+/g, ' ').toLowerCase();
  const defs = new Set(), defLines = new Set();
  let inCell = false;

  function codeEnd(i, e) {
    let k = i; while (k < e && raw[k] === '`') k++;
    const len = k - i; let j = k;
    while (j < e) {
      if (raw[j] === '`') { let t = j; while (t < e && raw[t] === '`') t++; if (t - j === len) return { open: k, close: j, end: t }; j = t; }
      else j++;
    }
    return null;
  }
  function bracketEnd(i, e) {
    let depth = 0;
    for (let j = i; j < e; j++) {
      const c = raw[j];
      if (c === '\\') { j++; continue; }
      if (c === '`') { const r = codeEnd(j, e); if (r) { j = r.end - 1; continue; } }
      if (c === '[') depth++;
      else if (c === ']') { depth--; if (depth === 0) return j; }
    }
    return -1;
  }
  function parseLink(i, e) {
    const j = bracketEnd(i, e);
    if (j < 0 || j === i + 1) return null;
    if (raw[j + 1] === '(') {
      let k = j + 2, pd = 1;
      for (; k < e; k++) {
        const c = raw[k];
        if (c === '\\') { k++; continue; }
        if (c === '(') pd++;
        else if (c === ')') { pd--; if (pd === 0) break; }
      }
      return k < e ? { textEnd: j, end: k + 1 } : null;
    }
    if (!defs.size) return null;
    if (raw[j + 1] === '[') {
      const k = raw.indexOf(']', j + 2);

        const label = raw.slice(j + 2, k) || raw.slice(i + 1, j);

  function tryEmph(i, s, e) {
    const c = raw[i];
    let k = i; while (k < e && raw[k] === c) k++;

    if (L > 3 || (c === '~' && L !== 2)) return null;
    if (k >= e || WS.test(raw[k])) return null;
    if (c === '_' && i > s && WORD.test(raw[i - 1])) return null;
    let j = k;
    while (j < e) {
      const ch = raw[j];
      if (ch === '\\') { j += 2; continue; }
      if (ch === '`') { const r = codeEnd(j, e); if (r) { j = r.end; continue; } }
      if (ch === c) {
        let t = j; while (t < e && raw[t] === c) t++;
        if (t - j === L && j > k && !WS.test(raw[j - 1])) {
          if (!(c === '_' && t < e && WORD.test(raw[t]))) return { cs: k, ce: j, end: t, L };
        }
        j = t; continue;
      }
      j++;
    }
    return null;
  }
  const TAGS = { 1: ['<em>', '</em>'], 2: ['<strong>', '</strong>'], 3: ['<strong><em>', '</em></strong>'] };
  function inline(s, e) {
    if (e - s > 20000) { emitRaw(s, e); return; }
    let i = s;
    while (i < e) {
      const c = raw[i];
      if (c === '\\' && i + 1 < e && PUNCT.test(raw[i + 1])) { emit(raw[i + 1], i, i + 2); i += 2; continue; }
      if (c === '`') {
        const r = codeEnd(i, e);
        if (r) { const cs = out.length; emitRaw(r.open, r.close); groups.push({ kind: 'code', gs: i, ge: r.end, cs, ce: out.length, rcs: r.open, rce: r.close, split: true }); i = r.end; continue; }
        let k = i; while (k < e && raw[k] === '`') k++; emitRaw(i, k); i = k; continue;
      }
      if ((c === '!' && raw[i + 1] === '[') || c === '[') {
        const o = c === '!' ? i + 1 : i;
        const r = parseLink(o, e);
        if (r) { const cs = out.length; inline(o + 1, r.textEnd); groups.push({ kind: 'link', gs: i, ge: r.end, cs, ce: out.length, rcs: o + 1, rce: r.textEnd, split: true }); i = r.end; continue; }
      }
      if (c === '<') {
        const seg = raw.slice(i, Math.min(e, i + 2048));
        const m = /^<((?:https?|mailto|ftp):[^\s<>]+|[^\s<>@]+@[^\s<>@]+\.[^\s<>@]+)>/i.exec(seg);
        if (m) { const cs = out.length; emitRaw(i + 1, i + 1 + m[1].length); groups.push({ kind: 'link', gs: i, ge: i + m[0].length, cs, ce: out.length, rcs: i + 1, rce: i + 1 + m[1].length, split: false }); i += m[0].length; continue; }
        const t = TAG.exec(seg);
        if (t) { if (t[1].toLowerCase() === 'br') emit(inCell ? ' ' : '\n', i, i + t[0].length); i += t[0].length; continue; }
      }
      if (c === '*' || c === '_' || c === '~') {
        const r = tryEmph(i, s, e);
        if (r) {
          const cs = out.length; inline(r.cs, r.ce);
          groups.push({ kind: 'emph', gs: i, ge: r.end, cs, ce: out.length, rcs: r.cs, rce: r.ce, split: true, tag: c === '~' ? ['<del>', '</del>'] : TAGS[r.L] });
          i = r.end; continue;
        }
        let k = i; while (k < e && raw[k] === c) k++; emitRaw(i, k); i = k; continue;
      }
      out.push(c); A.push(i); B.push(i + 1); i++;
    }
  }
  const isSep = (t) => t.includes('|') && t.includes('-') && /^[ \t]*\|?[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/.test(t);
  function tableRow(s, e) {
    const pipes = []; let inCode = false;
    for (let i = s; i < e; i++) {
      const c = raw[i];
      if (c === '\\') { i++; continue; }
      if (c === '`') { inCode = !inCode; continue; }
      if (c === '|' && !inCode) pipes.push(i);
    }
    let i0 = s; while (i0 < e && (raw[i0] === ' ' || raw[i0] === '\t')) i0++;
    let te = e; while (te > s && (raw[te - 1] === ' ' || raw[te - 1] === '\t')) te--;
    let cs0 = s, ce0 = e;
    if (pipes.length && pipes[0] === i0) cs0 = pipes.shift() + 1;
    if (pipes.length && pipes[pipes.length - 1] === te - 1) ce0 = pipes.pop();
    const cells = [];
    let a0 = cs0;
    for (let k = 0; k <= pipes.length; k++) {
      const b0 = k < pipes.length ? pipes[k] : ce0;
      let a = a0, b = b0;
      while (a < b && (raw[a] === ' ' || raw[a] === '\t')) a++;
      while (b > a && (raw[b - 1] === ' ' || raw[b - 1] === '\t')) b--;
      cells.push([a, b]);
      a0 = b0 + 1;
    }
    inCell = true;
    for (let k = 0; k < cells.length; k++) {
      inline(cells[k][0], cells[k][1]);
      if (k < cells.length - 1) emit('\t', cells[k][1], cells[k + 1][0]);
    }
    inCell = false;
  }

  const lines = [];
  { let ls = 0; for (;;) { let nl = raw.indexOf('\n', ls); if (nl === -1) nl = n; lines.push([ls, nl]); if (nl === n) break; ls = nl + 1; } }
  // reference definitions: "[label]: url" lines (not inside fences, not continuing a paragraph)
  if (raw.includes(']:')) {
    let f = null, open = true;
    for (let li = 0; li < lines.length; li++) {
      const L = raw.slice(lines[li][0], lines[li][1]);
      if (f) { const m = /^ {0,3}(`{3,}|~{3,})[ \t]*$/.exec(L); if (m && m[1][0] === f.ch && m[1].length >= f.len) f = null; open = true; continue; }
      const mf = FENCE.exec(L);
      if (mf && !(mf[1][0] === '`' && mf[2].includes('`'))) { f = { ch: mf[1][0], len: mf[1].length }; open = false; continue; }
      const md = DEF.exec(L);
      if (md && open) { defs.add(norm(md[1])); defLines.add(li); continue; }
      open = L.trim() === '' || /^ {0,3}#{1,6}(?:[ \t]|$)/.test(L);
    }
  }
  let fence = null, table = false, prevBlank = true, prevOdd = false;
  for (let li = 0; li < lines.length; li++) {
    const [s, e] = lines[li];
    const hasNL = e < n;
    const L = raw.slice(s, e);
    const hide = () => {
      if (!hasNL) { const k = out.length - 1; if (k >= 0 && out[k] === '\n' && A[k] === s - 1) { out.pop(); A.pop(); B.pop(); } }
    };
    const nl = () => { if (hasNL) { out.push('\n'); A.push(e); B.push(e + 1); } };
    const blank = L.trim() === '';
    if (fence) {
      const m = /^ {0,3}(`{3,}|~{3,})[ \t]*$/.exec(L);
      if (m && m[1][0] === fence.ch && m[1].length >= fence.len) { fence = null; hide(); prevBlank = false; continue; }
      emitRaw(s, e); nl(); continue;
    }
    const mf = FENCE.exec(L);
    if (mf && !(mf[1][0] === '`' && mf[2].includes('`'))) { fence = { ch: mf[1][0], len: mf[1].length }; hide(); prevBlank = false; table = false; continue; }
    if (defLines.has(li)) { hide(); prevBlank = true; continue; }
    if (!table && L.includes('|') && li + 1 < lines.length && isSep(raw.slice(lines[li + 1][0], lines[li + 1][1]))) table = true;
    if (table) {
      if (blank || !L.includes('|')) table = false;
      else if (isSep(L)) { hide(); continue; }
      else { tableRow(s, e); nl(); prevBlank = false; prevOdd = true; continue; }
    }
    if (/^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/.test(L) || (!prevBlank && !prevOdd && /^ {0,3}=+[ \t]*$/.test(L))) { hide(); prevBlank = false; continue; }
    prevOdd = /^ {0,3}>/.test(L);
    // a backslash at the end of a line is a hard line break, not text
    let le = e;
    if (hasNL && raw[e - 1] === '\\') { let k = e - 1; while (k > s && raw[k - 1] === '\\') k--; if ((e - k) % 2 === 1) le = e - 1; }
    let i = s, mq;
    while ((mq = /^ {0,3}> ?/.exec(raw.slice(i, e)))) i += mq[0].length;
    let hiddenEnd = i;
    const rest = raw.slice(i, e);
    const mh = /^ {0,3}(#{1,6})(?:[ \t]+|$)/.exec(rest);
    if (mh) {
      i += mh[0].length; hiddenEnd = i;
      let ce = e;
      const mc = /(^|[ \t]+)#+[ \t]*$/.exec(raw.slice(i, e));
      if (mc) ce = i + mc.index;
      const cs = out.length;
      inline(i, ce);
      lps.push({ ls: s, pe: hiddenEnd, cs, ce: out.length, le: e });
      nl(); prevBlank = blank; continue;
    }
    const cs = out.length;
    const ml = /^([ \t]*)([-*+])([ \t]+)/.exec(rest);
    if (ml) {
      const mk = i + ml[1].length;
      emitRaw(i, mk);
      const after = mk + 1 + ml[3].length;
      const mt = /^\[([ xX])\](?=[ \t]|$)/.exec(raw.slice(after, e));
      if (mt) { emit(mt[1] === ' ' ? '☐' : '☑', mk, after + 3); inline(after + 3, le); }
      else { emit('•', mk, mk + 1); emitRaw(mk + 1, after); inline(after, le); }
    } else {
      inline(i, le);
    }
    if (hiddenEnd > s) lps.push({ ls: s, pe: hiddenEnd, cs, ce: out.length, le: e });
    nl(); prevBlank = blank;
  }
  return { out: out.join(''), A, B, groups, lps };
}

/* Source for the "서식 적용 화면" view: emphasis the stripper found is turned into

function renderSource(raw) {
  if (!/[*_~]/.test(raw)) return raw;

  for (const g of v.groups) if (g.tag) { edits.push([g.gs, g.rcs, g.tag[0]], [g.rce, g.ge, g.tag[1]]); }

  const parts = []; let last = 0;

  const USAGE = "# 웹 메모장 사용 가이드\n\n마크다운이 섞인 글을 깔끔하게 읽고 편집하고 복사할 수 있는 웹 메모장이에요.\n\n처음이라면 화면 위쪽의 **서식 적용 화면**을 눌러 보세요. 제목·목록·표가 정돈되어 이 안내를 편하게 읽을 수 있어요. 휴대폰에서는 **미리보기**라고 표시돼요.\n\n> 이 안내도 일반 메모예요. 자유롭게 고치거나 삭제할 수 있고, 삭제한 뒤에는 새로고침해도 다시 생기지 않아요.\n\n## 먼저 알아둘 저장 방식\n\n- 메모는 현재 브라우저에 자동으로 저장돼요.\n- 서버로 전송되거나 다른 사용자에게 공유되지 않아요.\n- 같은 링크를 열어도 다른 브라우저나 다른 기기에는 메모가 나타나지 않아요.\n- 브라우저의 사이트 데이터를 지우거나 시크릿 창을 닫으면 메모도 사라져요.\n- 중요한 메모는 **파일** 메뉴에서 `.txt`나 `.md`로 저장해 백업해 주세요.\n\n## 메모 작성과 관리\n\n- 위쪽의 **+** 버튼이나 `Alt+N`으로 새 메모를 만들어요.\n- 메모는 위쪽 탭으로 나뉘며, 첫 줄이 기본 탭 이름이 돼요.\n- 탭을 두 번 누르면 이름을 바꿀 수 있어요.\n- 탭의 **×** 또는 **파일 → 메모 삭제**로 메모를 지워요. 삭제는 되돌릴 수 없어요.\n- 입력한 내용은 잠시 뒤 자동으로 저장돼요. 아래 상태 표시줄에서 저장 상태를 확인할 수 있어요.\n\n## 세 가지 보기\n\n| 보기 | 모바일 이름 | 표시 방식과 복사 결과 | 편집 |\n|---|---|---|---|\n| **서식 제거 텍스트** | 텍스트 | 마크다운 기호를 숨긴 깔끔한 글 | 가능 |\n| **마크다운 원본** | 마크다운 | 서식 기호를 포함한 원문 | 가능 |\n| **서식 적용 화면** | 미리보기 | 제목·굵게·목록·표 등을 적용한 화면 | 읽기 전용 |\n\n**서식 제거 텍스트**에서 글을 고쳐도 원본의 서식은 가능한 한 유지돼요. 표의 칸이나 줄처럼 구조를 바꿀 때는 **마크다운 원본**에서 편집하는 것이 안전해요.\n\n## 마크다운 예시\n\n아래 예시를 새 메모의 **마크다운 원본** 화면에 붙여넣고 세 가지 보기를 비교해 보세요.\n\n```markdown\n# 회의 메모\n\n## 오늘 할 일\n\n- **중요한 항목** 확인\n- [ ] 자료 정리\n- [x] 일정 공유\n\n| 담당 | 작업 |\n|---|---|\n| 민지 | 초안 작성 |\n| 준 | 최종 검토 |\n\n자세한 내용은 [프로젝트 저장소](https://github.com/edujoon/web-notepad)에서 확인하세요.\n```\n\n## 전체 복사와 파일 저장\n\n- **전체 복사**는 현재 선택한 보기 방식대로 메모 전체를 복사해요.\n- 서식 없이 붙여넣으려면 **서식 제거 텍스트**에서 복사하세요.\n- 제목·굵게·표 모양을 유지하려면 **서식 적용 화면**에서 복사하세요.\n- **파일 → 서식 제거 텍스트로 저장 (.txt)**은 글자만 저장해요.\n- **파일 → 마크다운 원본으로 저장 (.md)**은 마크다운 구조를 그대로 저장해요.\n- **파일 열기**로 `.txt`, `.md`, `.markdown` 파일을 새 메모로 가져올 수 있어요.\n\n## 편집 도구\n\n- **편집** 메뉴에서 실행 취소, 다시 실행, 찾기, 바꾸기, 줄 이동을 사용할 수 있어요.\n- **서식** 메뉴에서 자동 줄 바꿈과 기본/고정폭 글꼴을 선택할 수 있어요.\n- **보기** 메뉴에서 확대·축소와 상태 표시줄 표시 여부를 바꿀 수 있어요.\n- 메뉴의 붙여넣기가 브라우저 보안 설정에 막히면 `Ctrl+V` 또는 `⌘V`를 사용하세요.\n\n## 제한 사항\n\n- Vercel에 배포된 웹 메모장은 브라우저 로컬 저장 방식이라 기기 간 동기화를 제공하지 않아요.\n- 메모 하나는 저장 데이터 기준 약 250KB까지 지원해요. 전체 저장 공간은 브라우저의 localStorage 한도를 따라요.\n- 서식 적용 화면은 읽기 전용이에요.\n- 글꼴과 마크다운 미리보기 라이브러리는 외부 CDN을 사용하므로 네트워크 환경에 따라 기본 글꼴이나 단순 표시로 대체될 수 있어요.\n\n## 라이선스와 문의\n\n이 메모장은 **MIT 라이선스**로 공개되어 있어요. 자유롭게 복사하고 고쳐 쓸 수 있어요.\n\n프로젝트 저장소: [edujoon/web-notepad](https://github.com/edujoon/web-notepad)\n\n**JOON** · [eduedujoon@gmail.com](mailto:eduedujoon@gmail.com)<br>\n2026. 9. 22.";

rflow: hidden; }\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; background: none; border: 0; padding: 0; }\nbutton:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--carbon); outline-offset: 1px; }\n[hidden] { display: none !important; }\nsvg { display: block; }\n\n#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }\n\n/* tabs */\n.top { display: flex; align-items: flex-end; gap: 2px; padding: 7px 8px 0; background: var(--desk); min-width: 0; }\n.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }\n.tabs::-webkit-scrollbar { display: none; }\n.tab { position: relative; display: flex; align-items: center; height: 34px; border-radius: 7px 7px 0 0; color: var(--muted); flex: 0 0 auto; }\n.tab:hover { background: rgba(127, 134, 150, .10); }\n.tab.active { background: var(--paper); color: var(--ink); box-shadow: inset 0 2px 0 var(--carbon); }\n.tab-main { display: flex; align-items: center; gap: 7px; height: 100%; padding: 0 4px 0 13px; max-width: 220px; border-radius: 7px 0 0 0; }\n.tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }\n.tab.active .tab-name { font-weight: 500; }\n.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--carbon); flex: 0 0 auto; }\n.tab-x { width: 26px; height: 26px; margin-right: 4px; border-radius: 5px; display: grid; place-items: center; color: var(--faint); opacity: 0; }\n.tab:hover .tab-x, .tab.active .tab-x, .tab-x:focus-visible { opacity: 1; }\n.tab-x:hover { background: var(--hover); color: var(--ink); }\n.newtab { width: 30px; height: 30px; margin: 0 0 2px 4px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: 0 0 auto; }\n.newtab:hover { background: rgba(127, 134, 150, .14); color: var(--ink); }\n\n/* bar */\n.bar { display: flex; align-items: center; justify-content: space-between; gap: 10p ar(--carbon-soft); color: var(--ink); border-bottom: 1px solid var(--rule); }\n\n/* stage */\n.stage { position: relative; flex: 1; min-height: 0; background: var(--paper); font-size: var(--fs); }\n.editor-wrap { position: absolute; inset: 0; }\n.backdrop, #ta {\n  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0;\n  padding: var(--pad-y) var(--pad-x);\n  font-family: var(--sans); font-size: var(--fs); line-height: 1.75; letter-spacing: 0;\n  tab-size: 4; -moz-tab-size: 4;\n  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;\n  overflow: auto;\n}\n.stage.mono .backdrop, .stage.mono #ta { font-family: var(--mono); line-height: 1.65; }\n.nowrap .backdrop, .nowrap #ta { white-space: pre; overflow-wrap: normal; }\n.backdrop { color: transparent; pointer-events: none; z-index: 0; user-select: none; }\n.backdrop mark { color: transparent; background: var(--carbon-soft); border-radius: 2px; }\n.backdrop mark.cur { background: var(--carbon-strong); }\n#ta { z-index: 1; background: transparent; color: var(--ink); caret-color: var(--carbon); resize: none; outline: none; }\n#ta::placeholder { color: var(--faint); }\n#ta::selection { background: var(--carbon-strong); }\n#ta[readonly] { caret-color: transparent; }\n\n.rendered { position: absolute; inset: 0; overflow: auto; padding: var(--pad-y) var(--pad-x) 64px; }\n.md { max-width: 72ch; font-size: var(--fs); line-height: 1.8; overflow-wrap: break-word; word-break: keep-all; }\n.md.fallback { white-space: pre-wrap; word-break: normal; }\n.md > :first-child { margin-top: 0; }\n.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.35; margin: 1.5em 0 .5em; font-weight: 600; letter-spacing: -.01em; }\n.md h1 { font-size: 1.65em; }\n.md h2 { font-size: 1.32em; padding-bottom: .25em; border-bottom: 1px solid var(--rule); }\n.md h3 { font-size: 1.14em; }\n.md h4, .md h5, .md h6 { font-size: 1em; }\n.md p { margin: .6em 0; }\n.md ul, .md ol { padding-left: 1.5em; margin: .5em ><kbd data-alt=\"N\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"openFile\"><span></span><span>파일 열기…</span><kbd></kbd></button>\n          <div class=\"sep\" role=\"separator\"></div>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"saveTxt\" data-need=\"downloads\"><span></span><span>서식 제거 텍스트로 저장 (.txt)</span><kbd></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"saveMd\" data-need=\"downloads\"><span></span><span>마크다운 원본으로 저장 (.md)</span><kbd></kbd></button>\n\n          <div class=\"sep\" role=\"separator\"></div>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"rename\" data-need=\"write\"><span></span><span>이름 바꾸기…</span><kbd></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"del\" data-need=\"write\"><span></span><span>메모 삭제…</span><kbd></kbd></button>\n        </div>\n      </div>\n      <div class=\"menu\">\n        <button class=\"menu-btn\" aria-haspopup=\"menu\" aria-expanded=\"false\">편집</button>\n        <div class=\"menu-pop\" role=\"menu\" hidden>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"undo\" data-need=\"write\"><span></span><span>실행 취소</span><kbd data-mod=\"Z\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"redo\" data-need=\"write\"><span></span><span>다시 실행</span><kbd data-mod=\"Y\"></kbd></button>\n          <div class=\"sep\" role=\"separator\"></div>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"cut\" data-need=\"edit\"><span></span><span>잘라내기</span><kbd data-mod=\"X\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"copy\"><span></span><span>복사</span><kbd data-mod=\"C\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"paste\" data-need=\"edit\"><span></span><span>붙여넣기</span><kbd data-mod=\"V\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"deleteSel\" data-need=\"edit\"><span></span><s cmd=\"modePlain\" data-check=\"modePlain\"><span class=\"ck\">✓</span><span>서식 제거 텍스트</span><kbd data-alt=\"1\"></kbd></button>\n          <button class=\"mi\" role=\"menuitemradio\" data-cmd=\"modeRaw\" data-check=\"modeRaw\"><span class=\"ck\">✓</span><span>마크다운 원본</span><kbd data-alt=\"2\"></kbd></button>\n          <button class=\"mi\" role=\"menuitemradio\" data-cmd=\"modeRendered\" data-check=\"modeRendered\"><span class=\"ck\">✓</span><span>서식 적용 화면</span><kbd data-alt=\"3\"></kbd></button>\n          <div class=\"sep\" role=\"separator\"></div>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"zoomIn\"><span></span><span>확대</span><kbd data-mod=\"+\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"zoomOut\"><span></span><span>축소</span><kbd data-mod=\"−\"></kbd></button>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"zoomReset\"><span></span><span>기본 크기로</span><kbd data-mod=\"0\"></kbd></button>\n          <div class=\"sep\" role=\"separator\"></div>\n          <button class=\"mi\" role=\"menuitemcheckbox\" data-cmd=\"statusbar\" data-check=\"statusbar\"><span class=\"ck\">✓</span><span>상태 표시줄</span><kbd></kbd></button>\n        </div>\n      </div>\n      <div class=\"menu\">\n        <button class=\"menu-btn\" aria-haspopup=\"menu\" aria-expanded=\"false\">도움말</button>\n        <div class=\"menu-pop\" role=\"menu\" hidden>\n          <button class=\"mi\" role=\"menuitem\" data-cmd=\"about\"><span></span><span>메모장 정보</span><kbd></kbd></button>\n        </div>\n      </div>\n    </nav>\n\n    <div class=\"tools\">\n      <div class=\"seg\" id=\"seg\" role=\"radiogroup\" aria-label=\"보기 방식\">\n        <button type=\"button\" role=\"radio\" data-mode=\"plain\" aria-checked=\"true\" aria-label=\"서식 제거 텍스트\" title=\"마크다운 기호(**, # 등)를 숨기고 글자만 보여요. 바로 편집할 수 있어요 (Alt+1)\"><span class=\"l\">서식 제거 텍스트</span><span class=\"s\">텍스트</span></button>\n        <button type=\"button\" role=\"radio\" data-mode=\"raw\" aria-checked=\"false\" tabindex=\"-1\" aria-label=\"마크다운 원본\" title=\"마크다운 기호까지 붙여넣은 그대로 보여요. 기호까지 편집할 수 있어요 (Alt+2)\"><span class=\"l\">마크다운 원본</span><span class=\"s\">마크다운</span></button>\n        <button type=\"button\" role=\"radio\" data-mode=\"rendered\" aria-checked=\"false\" tabindex=\"-1\" aria-label=\"서식 적용 화면\" title=\"제목, 굵게, 목록, 표 같은 서식을 적용해서 보여요. 읽기 전용이에요 (Alt+3)\"><span class=\"l\">서식 적용 화면</span><span class=\"s\">미리보기</span></button>\n      </div>\n      <button class=\"copy\" id=\"copyAll\" title=\"지금 보이는 방식 그대로 전체를 복사해요\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"5.5\" y=\"5.5\" width=\"8\" height=\"8.5\" rx=\"1.5\"/><path d=\"M10.5 5.5V3.5A1.5 1.5 0 0 0 9 2H4A1.5 1.5 0 0 0 2.5 3.5v6A1.5 1.5 0 0 0 4 11h1.5\"/></svg>\n        전체 복사\n      </button>\n    </div>\n  </div>\n\n  <div class=\"findbar\" id=\"findbar\" hidden>\n    <button class=\"ftoggle\" id=\"ftoggle\" aria-expanded=\"false\" aria-controls=\"replrow\" aria-label=\"바꾸기 펼치기\" title=\"바꾸기 펼치기\">\n      <svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 10l4-4 4 4\"/></svg>\n    </button>\n    <div class=\"find-rows\">\n    <div class=\"find-row\">\n      <div class=\"fq-wrap\">\n        <input type=\"text\" id=\"fq\" placeholder=\"찾을 내용\" aria-label=\"찾을 내용\" autocomplete=\"off\" spellcheck=\"false\">\n        <span class=\"fcount\" id=\"fcount\" aria-live=\"polite\"></span>\n      </div>\n      <button class=\"ibtn\" id=\"fprev\" title=\"이전 찾기 (Shift+Enter)\" aria-label=\"이전 찾기\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 13V3M4 7l4-4 4 4\"/></svg></button>\n      <button class=\"ibtn\" id=\"fnext\" title=\"다음 찾기 (Enter)\" aria-label=\ ===== */\nfunction stripMd(raw) {\n  const out = [], A = [], B = [], groups = [], lps = [];\n  const n = raw.length;\n  const emit = (ch, s, e) => { out.push(ch); A.push(s); B.push(e); };\n  const emitRaw = (s, e) => { for (let i = s; i < e; i++) { out.push(raw[i]); A.push(i); B.push(i + 1); } };\n  const PUNCT = /[!-\\/:-@\\[-`{-~]/;\n  const WORD = /[\\p{L}\\p{N}]/u;\n  const WS = /\\s/;\n  const TAG = /^<\\/?(br|hr|b|strong|i|em|u|s|strike|del|ins|mark|sup|sub|span|small|big|kbd|code|a|font|center|p|div|img|abbr|cite|q|samp|var|tt)(?:\\s[^<>]*)?\\/?>/i;\n  const DEF = /^ {0,3}\\[((?:[^\\]\\\\]|\\\\.)+)\\]:[ \\t]*(?:<[^>\\n]*>|[^\\s<>]\\S*)(?:[ \\t]+(?:\"[^\"]*\"|'[^']*'|\\([^)]*\\)))?[ \\t]*$/;\n  const FENCE = /^ {0,3}(`{3,}|~{3,})(.*)$/;\n  const norm = (l) => l.trim().replace(/\\s+/g, ' ').toLowerCase();\n  const defs = new Set(), defLines = new Set();\n  let inCell = false;\n\n  function codeEnd(i, e) {\n    let k = i; while (k < e && raw[k] === '`') k++;\n    const len = k - i; let j = k;\n    while (j < e) {\n      if (raw[j] === '`') { let t = j; while (t < e && raw[t] === '`') t++; if (t - j === len) return { open: k, close: j, end: t }; j = t; }\n      else j++;\n    }\n    return null;\n  }\n  function bracketEnd(i, e) {\n    let depth = 0;\n    for (let j = i; j < e; j++) {\n      const c = raw[j];\n      if (c === '\\\\') { j++; continue; }\n      if (c === '`') { const r = codeEnd(j, e); if (r) { j = r.end - 1; continue; } }\n      if (c === '[') depth++;\n      else if (c === ']') { depth--; if (depth === 0) return j; }\n    }\n    return -1;\n  }\n  function parseLink(i, e) {\n    const j = bracketEnd(i, e);\n    if (j < 0 || j === i + 1) return null;\n    if (raw[j + 1] === '(') {\n      let k = j + 2, pd = 1;\n      for (; k < e; k++) {\n        const c = raw[k];\n        if (c === '\\\\') { k++; continue; }\n        if (c === '(') pd++;\n        else if (c === ')') { pd--; if (pd === 0) break; }\n      }\n      return k < e ? { textEnd: j, end:   const PROMPT = '첨부한 HTML 파일을 수정하지 말고 그대로 아티팩트로 게시해줘. 실시간 동기화용 db 기능과 파일 저장용 downloads 기능을 켜서 게시해줘.';
  const $ = (id) => document.getElementById(id);
  let db = null, downloads = null, timer = 0, last = 0, lastVer = null, lastBuild = 0, stale = false;

  const say = (msg) => {
    const el = $('toast'); if (!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(say.t); say.t = setTimeout(() => el.classList.remove('show'), 2600);
  };

  /* ---------- 10분마다 처음 상태로 ---------- */
  function notice() {
    const bar = $('status');
    if (!bar || $('demoNote')) return;
    const el = document.createElement('span');
    el.id = 'demoNote';
    el.textContent = '체험용 메모장이라 1분마다 처음 상태로 돌아가요';
    el.style.color = 'var(--carbon)';
    bar.insertBefore(el, bar.querySelector('.sync'));
  }
  const schedule = (ms) => { if (stale) return; clearTimeout(timer); timer = setTimeout(run, Math.max(1000, ms)); };
  function stepAside() {
    stale = true; clearTimeout(timer);
    const el = document.getElementById('demoNote');
    if (el) el.textContent = '새 버전이 나왔어요. 새로고침해 주세요';
  }
  async function reset(now) {
    const snap = await db.collection('notes').get();
    await db.doc('notes/' + HOME).set({ name: '웹 메모장 사용 가이드', body: USAGE, createdAt: 0, updatedAt: now, by: 'demo-reset' });
    for (const d of snap.docs) if (d.id !== HOME) { try { await db.doc('notes/' + d.id).delete(); } catch {} }
  }
  async function run() {
    if (!db) return;
    try {
      if (stale) return;
      const now = Date.now();
      if (lastBuild === BUILD && last && now - last < PERIOD - 500) { schedule(last + PERIOD - now); return; }
      const lock = await db.doc('meta/demo-lock').acquire({ holder: HOLDER, ttlMs: 20000 });
      if (!lock.acquired) { schedule(15000 + Math.random() * 15000); return; }
      const meta = await db.doc('meta/demo').get();
      const d = meta.exists ? (meta.data() || {}) : {};
      const seen = Number(d.lastReset) || 0, bld = Number(d.build) || 0;
      if (bld > BUILD) { stepAside(); return; }
      if (bld === BUILD && seen && Date.now() - seen < PERIOD - 500) { last = seen; lastBuild = bld; schedule(seen + PERIOD - Date.now()); return; }
      await reset(Date.now());
      await db.doc('meta/demo').set({ lastReset: Date.now(), build: BUILD, usageVersion: VERSION, by: HOLDER });
      setTimeout(() => { if (db) reset(Date.now()).catch(() => {}); }, 5000);
    } catch { schedule(30000); }
  }

  /* ---------- 앱 복제 ---------- */
  const CSS = `
.getapp { margin-left: auto; align-self: center; flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px 0 10px; border: 1px solid var(--carbon); border-radius: 7px; background: var(--carbon-soft); color: var(--carbon); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.getapp:hover { background: var(--carbon); color: var(--carbon-ink); }
.getapp:focus-visible { outline: 2px solid var(--carbon); outline-offset: 2px; }
.clone { width: min(460px, 100%); }
.clone .steps { margin: 0 0 16px; padding-left: 20px; font-size: 14px; line-height: 1.7; }
.clone .steps li { margin-bottom: 8px; }
.clone a { color: var(--carbon); text-underline-offset: 3px; }
.clone .prompt { display: block; margin-top: 6px; padding: 9px 11px; background: var(--hover); border-radius: 6px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--muted); user-select: all; }
@media (max-width: 560px) { .getapp { padding: 0 10px 0 8px; } }`;
  const DIALOG = `<div class="dlg clone" role="dialog" aria-modal="true" aria-labelledby="cloneTitle">
    <h2 id="cloneTitle">내 메모장으로 복제하기</h2>
    <p>이 메모장을 그대로 복제해서, 나만의 메모장으로 쓸 수 있어요.</p>
    <ol class="steps">
      <li>아래 <b>HTML 파일 받기</b>를 눌러 파일을 받아요.</li>
      <li><a id="cloneNew" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Claude 새 대화창</a>에 그 파일을 올리고, 아래 문구를 붙여넣어요.
        <code class="prompt" id="clonePrompt"></code>
      </li>
      <li>게시된 링크를 즐겨찾기에 넣고, 다른 기기에서도 같은 계정으로 열면 돼요.</li>
    </ol>
    <div class="dlg-actions">

      <button class="btn ghost" id="clonePromptCopy">문구 복사</button>

    </div>
  </div>`;
  let layer = null;
  function build() {
    const style = document.createElement('style'); style.textContent = CSS; document.head.appendChild(style);
    const btn = document.createElement('button');
    btn.className = 'getapp'; btn.id = 'getApp'; btn.type = 'button';
    btn.title = '이 메모장을 내 것으로 복제하는 방법을 알려줘요';
    btn.setAttribute('aria-label', '앱 복제');
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.6"/><path d="M10.5 5.5v-2A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2"/></svg><span>앱 복제</span>';
    btn.addEventListener('click', open);
    document.querySelector('.top').appendChild(btn);

    $('clonePrompt').textContent = PROMPT;
    /* 새 대화창을 열면서 문구까지 미리 채워 두려는 시도 (지원되지 않으면 빈 대화창만 열려요) */
    $('cloneNew').href = 'https://claude.ai/new?q=' + encodeURIComponent(PROMPT);
    $('cloneClose').addEventListener('click', close);
    $('cloneGet').addEventListener('click', download);
    $('clonePromptCopy').addEventListener('click', async () => say(await copy(PROMPT) ? '안내 문구를 복사했어요' : '복사하지 못했어요'));
    layer.addEventListener('mousedown', (e) => { if (e.target === layer) close(); });
    document.addEventListener('keydown', (e) => {
      if (layer.hidden) return;
      e.stopPropagation();
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Tab') {
        e.preventDefault();

    const pop = document.querySelector('.menu .menu-pop');
    if (pop) {
      const sep = document.createElement('div'); sep.className = 'sep'; sep.setAttribute('role', 'separator');

      mi.className = 'mi'; mi.setAttribute('role', 'menuitem');
      mi.innerHTML = '<span></span><span>메모장 앱 복제하기…</span><kbd></kbd>';

      pop.append(sep, mi);
    }
  }
  let prevFocus = null;
  function open() { if (!layer) return; prevFocus = document.activeElement; layer.hidden = false; setTimeout(() => $('cloneGet').focus(), 0); }
  function close() { if (!layer) return; layer.hidden = true; if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true }); }
  async function copy(text) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch {}

      const t = document.createElement('textarea');
      t.value = text; t.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(t); t.select();
      const okc = document.execCommand('copy'); t.remove(); return okc;
    } catch { return false; }
  }
  async function download() {
    if (downloads) {
      try { await downloads.save({ filename: '메모장-웹앱.html', data: APP_FILE }); say('메모장 앱 파일을 저장했어요'); close(); }
      catch (e) {
        const code = e && e.code;
        if (code === 'declined') return;
        say(code === 'rate_limited' ? '잠시 후 다시 시도해 주세요' : code === 'extension_not_enabled' || code === 'rejected_extension' ? '이 화면에서는 이 형식의 파일을 받을 수 없어요' : '파일로 저장하지 못했어요');
      }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([APP_FILE], { type: 'text/html;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = '메모장-웹앱.html'; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      say('메모장 앱 파일을 저장했어요'); close();
    } catch { say('이 화면에서는 파일로 저장할 수 없어요'); }
  }

  /* 안내문 안의 "바로가기" 링크가 해당 제목으로 이동하게 (체험용에서만) */
  function anchors() {
    const slug = (t) => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('#md a[href^="#"]');
      if (!a) return;
      e.preventDefault(); e.stopPropagation();
      const want = decodeURIComponent(a.getAttribute('href').slice(1));
      const box = $('rendered');
      const h = [...document.querySelectorAll('#md h1, #md h2, #md h3, #md h4')].find((x) => slug(x.textContent) === want);
      if (h && box) box.scrollTop += h.getBoundingClientRect().top - box.getBoundingClientRect().top - 12;
    }, true);
  }

  (async () => {
    anchors();
    const hasClaude = !!(window.claude && window.claude.use);
    if (hasClaude) { try { downloads = await window.claude.use('downloads'); } catch { downloads = null; } }
    if (downloads || !hasClaude) build();
    if (!hasClaude) return;
    try { db = await window.claude.use('db'); } catch { db = null; }
    if (!db) return;
    notice();
    db.doc('meta/demo').onSnapshot((s) => {
      const d = s.exists ? (s.data() || {}) : {};
      last = Number(d.lastReset) || 0;
      lastVer = d.usageVersion || d.readmeVersion || null;
      lastBuild = Number(d.build) || 0;
      if (lastBuild > BUILD) { stepAside(); return; }
      schedule(lastBuild !== BUILD ? 300 : last ? last + PERIOD - Date.now() : 1000);
    }, () => schedule(60000));
  })();
})();
